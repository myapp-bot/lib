
name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier les fichiers du projet
        run: |
          test -f package.json || (echo "ERREUR : package.json introuvable" && exit 1)
          test -f capacitor.config.ts -o -f capacitor.config.json -o -f capacitor.config.js || (echo "ERREUR : configuration Capacitor introuvable" && exit 1)

      - name: Installer les dépendances
        run: npm ci

      - name: Tester les fonctions
        run: node --test tests/*.test.cjs

      - name: Vérifier Capacitor Android
        run: |
          npm ls @capacitor/core @capacitor/cli @capacitor/android
          npx cap --version

      - name: Ajouter Android si nécessaire
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Synchroniser Capacitor
        run: npm run sync

      - name: Vérifier le projet Android
        run: |
          test -f android/gradlew || (echo "ERREUR : gradlew introuvable" && exit 1)
          test -f android/app/build.gradle -o -f android/app/build.gradle.kts || (echo "ERREUR : configuration Gradle Android introuvable" && exit 1)

      - name: Compiler APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: liberte-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
